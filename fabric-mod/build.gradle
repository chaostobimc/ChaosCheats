plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Loom fuegt Minecraft- und Fabric-Repositories automatisch hinzu.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Seit 1.21.11 ist Minecraft nicht mehr obfuskiert, daher Mojang-Mappings.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	// Version vor dem Closure in eine lokale Variable lesen,
	// sonst scheitert der Configuration Cache am Zugriff auf "project".
	def modVersion = project.version
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
